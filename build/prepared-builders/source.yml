jobs:
  linux-x86_64:
    runs-on: ${{ vars.LOCAL_LINUX_CI_ENABLED == 'true' && fromJSON('["self-hosted","linux","x64","linux-general"]')
      || 'ubuntu-24.04' }}
    steps:
    - name: Rust toolchain (stable)
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-gnu
        components: rustfmt, clippy
  linux-x86_64-package:
    runs-on: ${{ vars.LOCAL_LINUX_CI_ENABLED == 'true' && fromJSON('["self-hosted","linux","x64","linux-general"]')
      || 'ubuntu-24.04' }}
    steps:
    - name: Rust toolchain (stable)
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-gnu
