[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/harvest",
    "crates/source-audit",
    "crates/tui",
]

[workspace.package]
edition = "2024"
version = "0.7.4"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
arrow-array = "56"
arrow-schema = "56"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
syn = { version = "2", features = ["full", "parsing", "visit"] }
parquet = { version = "56", features = ["arrow", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# The reviewers' counterexample files (crates/core/tests/reviewer_counterexamples*.rs)
# are copied in byte-for-byte and must stay that way: they are the agreed
# minimum bar, and editing them -- even for style -- would undermine what
# they are for. They write `&[path.clone()]` where clippy now prefers
# `std::slice::from_ref`, a readability preference with no correctness or
# performance consequence. Relaxing exactly that lint workspace-wide is
# the smallest way to keep `-D warnings` meaningful everywhere else.
[workspace.lints.clippy]
cloned_ref_to_slice_refs = "allow"
# Re-review 3's reviewer_counterexamples_stack3.rs builds a fixture line
# with `format!` and no arguments; the same reasoning as above applies.
useless_format = "allow"
# The capability gate's type-resolved half (`crates/*/clippy.toml`) is
# denied by each product crate root for its non-test build
# (`#![cfg_attr(not(test), deny(clippy::disallowed_methods, ...))]`).
# Integration tests build disposable fixtures with `std::fs` and
# `std::process` directly, so the workspace default is `allow`: the deny
# lives at the crate roots, where it covers exactly the shipped code.
disallowed_methods = "allow"
disallowed_types = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# The source audits and their mutation corpus are CPU-bound in this one
# crate (a whole-program model rebuilt per corpus fixture). Optimizing it
# in the dev/test profile keeps `scripts/check.sh` fast without changing
# how any product crate is built.
[profile.dev.package.swamp-source-audit]
opt-level = 3
