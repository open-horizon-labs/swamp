name: check-full

# The full tier (`scripts/check-full.sh`): `scripts/check.sh` plus the
# heavy harnesses -- the compile-fail cases (trybuild against the
# production API), the mutation sweep (every corpus, re-review and
# operator mutation applied to a copy of the workspace) and the cost
# test (process-global work counters and a PATH spawn shim,
# single-threaded and alone). Split out of `ci.yml` (2026-09-24): these
# jobs are 60-90 minutes each and add nothing `ci.yml`'s fast tier
# doesn't already cover on every push -- they exist to catch drift
# between pushes, not to gate one.
#
# Runs on every push to main, so the tier has already passed (or is
# running) for a commit by the time it is tagged: `release.yml` does not
# run it again, it waits for this workflow's run on the tagged commit
# (`scripts/verify-gates.sh`) and runs it here only if there is none.
# It never runs on a feature-branch push, an unlabelled PR, or a schedule.
# Other ways to run it: `gh workflow run check-full.yml`, or adding the
# `full-check` label to a PR (removing and re-adding the label
# re-triggers it; a `synchronize` push to an already-labelled PR does
# not, by design -- ask for it explicitly if a later push needs another
# full-tier run before merge).
#
# The mutation sweep is about 70% of this tier's time. It tests the audit
# rules against known-bad snippets, so its verdict only changes when the
# rules, the lint configuration, the gate, the lockfile or clippy change.
# It runs on Linux only, and only when it has not already passed for this
# clippy version and these inputs (a cache keyed on both, saved after a
# passing sweep; `scripts/sweep-needed.sh`). There is no schedule. The rest
# of the tier is about 8 minutes.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [labeled]

permissions:
  contents: read

# One group per commit, not per ref: a newer push to main must not cancel
# the run a tag on the earlier commit is waiting for.
concurrency:
  group: check-full-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

jobs:
  linux-x86_64-check-full:
    name: Linux x86_64 (check-full)
    if: github.event_name != 'pull_request' || github.event.label.name == 'full-check'
    runs-on: ${{ vars.LOCAL_LINUX_CI_ENABLED == 'true' && fromJSON('["self-hosted","linux","x64","linux-general"]') || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      # Test fixtures make git commits; never let them reach a signing
      # agent on the runner.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: commit.gpgsign
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: rustfmt, clippy

      - name: Cargo cache
        if: vars.LOCAL_LINUX_CI_ENABLED != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: check-full-linux-x86_64

      # The sweep already passed for this clippy version and these inputs?
      # The key is both, so a new clippy or a changed input misses and the
      # sweep runs. The marker is saved only after it passes (below).
      - name: Mutation sweep key
        id: sweepkey
        run: |
          clippy=$(cargo clippy --version | tr -c 'A-Za-z0-9.\n' '-')
          echo "key=mutation-sweep-passed-$clippy-${{ hashFiles('crates/source-audit/**', 'crates/*/clippy.toml', 'crates/core/src/fs_gate/**', 'crates/core/src/lib.rs', 'crates/cli/src/main.rs', 'crates/tui/src/lib.rs', '.oh/guardrails/**', 'rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock') }}" >> "$GITHUB_OUTPUT"

      - name: Mutation sweep already passed?
        id: sweeppassed
        uses: actions/cache/restore@v4
        with:
          path: sweep-passed
          key: ${{ steps.sweepkey.outputs.key }}
          lookup-only: true

      - name: Mutation sweep needed?
        id: sweep
        run: echo "verdict=$(scripts/sweep-needed.sh '${{ steps.sweeppassed.outputs.cache-hit }}')" >> "$GITHUB_OUTPUT"

      # scripts/check-full.sh runs scripts/check.sh, then the compile-fail
      # cases, the mutation sweep and the cost test once each. The cost
      # test's own Linux contract (`reviewer_cost_measurement_stack3`'s
      # `linux_contract`) only runs where this job runs it.
      - name: scripts/check-full.sh
        env:
          SWAMP_SKIP_MUTATION_SWEEP: ${{ steps.sweep.outputs.verdict == 'skip' && '1' || '' }}
        run: scripts/check-full.sh

      # Reached only when the whole tier passed, so a marker exists only
      # for a sweep that passed.
      - name: Record that the mutation sweep passed
        if: steps.sweep.outputs.verdict == 'run'
        run: mkdir -p sweep-passed && date -u > sweep-passed/at

      - name: Save the mutation sweep marker
        if: steps.sweep.outputs.verdict == 'run'
        uses: actions/cache/save@v4
        with:
          path: sweep-passed
          key: ${{ steps.sweepkey.outputs.key }}

  macos-arm64-check-full:
    name: macOS arm64 (check-full)
    if: github.event_name != 'pull_request' || github.event.label.name == 'full-check'
    runs-on: ${{ vars.LOCAL_MACOS_CI_ENABLED == 'true' && fromJSON('["self-hosted","macOS","ARM64","macos-arm64"]') || 'macos-latest' }}
    timeout-minutes: 90
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: commit.gpgsign
      GIT_CONFIG_VALUE_0: "false"
      # Linux runs the sweep (when it has not passed yet); see the header.
      SWAMP_SKIP_MUTATION_SWEEP: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy

      - name: Cargo cache
        if: vars.LOCAL_MACOS_CI_ENABLED != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: check-full-macos-arm64

      - name: scripts/check-full.sh
        run: scripts/check-full.sh
