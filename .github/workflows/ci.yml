name: CI

# Native, non-release CI on both supported targets. Cross-compilation is
# not acceptance (#87): every job builds and RUNS the workspace tests on
# the operating system it claims to support.
#
#   linux-x86_64 -> ubuntu-24.04, pinned deliberately. Ubuntu 24.04 is the
#                   selected Linux validation baseline (#77/#79); a newer
#                   hosted image would test an environment nobody targets.
#   macos-arm64  -> the org's Apple-silicon builder when
#                   LOCAL_MACOS_CI_ENABLED is set, otherwise GitHub's hosted
#                   macOS runner. Same runner selection as release.yml, so a
#                   green CI run and a green release run mean the same thing.
#
# Packaging is exercised here too, on every push, with the same scripts
# release.yml uses (#88): `linux-x86_64-package` builds the release
# profile, packages the archives, smoke-tests the *extracted* archive and
# runs the Linux validation (#89) against it; `linux-newer-smoke` runs
# that 24.04-built archive on the newest hosted Ubuntu. Nothing is
# published from this workflow.
#
# This is the fast tier only (target: under ~10 minutes per OS on a warm
# cache). The heavy harnesses (compile-fail, mutation sweep, cost test --
# `scripts/check-full.sh`) live in `check-full.yml`, which never runs on
# a feature-branch push: it runs on every push to main (so `release.yml`
# finds it already done for a tagged commit and only waits for it), and on
# `gh workflow run check-full.yml` or a PR labelled `full-check`. Every
# push still gets this workflow (fast tier + the Linux archive smoke) so
# ordinary iteration stays quick without losing the deep coverage
# entirely -- that just moves off the push path.
#
# ON DEMAND (2026-09-30): a pull-request push no longer starts this workflow.
# Ask for it when you want it: `gh workflow run ci.yml --ref <branch>` (the run
# attaches to the branch head, so the PR shows it), or add the `ci` label to a
# PR (remove and re-add to run again). Pushes to main and to integration/**
# and stack/** branches still run it, and `release.yml`'s gate is unchanged
# (it waits for this workflow on the tagged commit). Runner selection:
# macOS already runs on the homelab (LOCAL_MACOS_CI_ENABLED); the Linux jobs
# do the same when LOCAL_LINUX_CI_ENABLED is 'true': the homelab fleet broker
# (homelab-infra/broker) provisions an ephemeral ubuntu:24.04 runner container
# on a linux-general host for the job (labels: self-hosted, linux, x64,
# linux-general; see CONTRIBUTING.md), otherwise they use GitHub's hosted
# ubuntu-24.04.

on:
  push:
    branches: ['main', 'integration/**', 'stack/**']
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A release default of `target-cpu=native` would make CI results
  # unusable as evidence for anything but the runner it ran on. The
  # documented Linux baseline is a generic x86_64 CPU (docs/platform.md).
  RUSTFLAGS: ""

jobs:
  linux-x86_64:
    name: Linux x86_64 (Ubuntu 24.04)
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci'
    runs-on: ${{ vars.LOCAL_LINUX_CI_ENABLED == 'true' && github.repository == 'open-horizon-labs/swamp' && (github.event_name
      != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","builder:3555d11a4f2605e479b2"]')
      || 'ubuntu-24.04' }}
    steps:
    - name: Activate shared builder
      shell: bash
      run: |
        echo 'CARGO_HOME=/opt/gh-builder/cargo' >> "$GITHUB_ENV"
        echo 'RUSTUP_HOME=/opt/gh-builder/rustup' >> "$GITHUB_ENV"
        cat /opt/gh-builder/path >> "$GITHUB_PATH"
        cat /opt/gh-builder/env >> "$GITHUB_ENV"
        export CARGO_HOME=/opt/gh-builder/cargo RUSTUP_HOME=/opt/gh-builder/rustup
        export PATH=/opt/gh-builder/cargo/bin:$PATH
        export RUSTUP_TOOLCHAIN=stable
        rustup update stable --no-self-update
        rustup component add rustfmt clippy --toolchain stable
        rustup target add x86_64-unknown-linux-gnu --toolchain stable
        echo 'RUSTUP_TOOLCHAIN=stable' >> "$GITHUB_ENV"
        compiler=$(rustc -vV | sed -n 's/^commit-hash: //p')
        export SCCACHE_S3_KEY_PREFIX="${SCCACHE_S3_KEY_PREFIX}${compiler}/"
        echo "SCCACHE_S3_KEY_PREFIX=$SCCACHE_S3_KEY_PREFIX" >> "$GITHUB_ENV"
        if [ "${RUSTC_WRAPPER:-}" = sccache ]; then
          # The base runner starts its daemon before Actions provides job env.
          # Restart before compiling so the daemon adopts this consumer's namespace.
          sccache --stop-server >/dev/null 2>&1 || true
          sccache --start-server
          sccache --show-stats
        fi
    - uses: actions/checkout@v5
    - name: Cargo cache
      if: vars.LOCAL_LINUX_CI_ENABLED != 'true'
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ci-linux-x86_64
    - name: Environment
      run: |
        set -euo pipefail
        uname -a
        rustc -vV
        ldd --version | head -1
        # Recorded, not required: the Linux jobs must not assume any of
        # these exist, and several tests skip explicitly when they do not.
        for t in lsof docker gh du; do
          printf '%s: %s\n' "$t" "$(command -v "$t" || echo '(absent)')"
        done
        # #86: which of this user's processes procfs will not show their
        # open files to this user, and why (credentials, capabilities,
        # cgroup) -- the evidence the occupancy scope is decided on.
        me="$(id -u)"
        for d in /proc/[0-9]*; do
          pid="${d#/proc/}"
          uid="$(awk '/^Uid:/{print $3}' "$d/status" 2>/dev/null || true)"
          [ "$uid" = "$me" ] || continue
          if ! readlink "$d/cwd" >/dev/null 2>&1; then
            echo "opaque same-user process $pid ($(cat "$d/comm" 2>/dev/null)):"
            grep -E '^(Uid|Gid|CapPrm|CapEff|CapAmb|NoNewPrivs|Seccomp):' "$d/status" 2>/dev/null | sed 's/^/    /'
            sed 's/^/    cgroup: /' "$d/cgroup" 2>/dev/null || true
          fi
        done
        echo "user manager: XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-unset}; $(systemctl --user show-environment >/dev/null 2>&1 && echo reachable || echo unreachable)"
        echo "loginctl linger: $(loginctl show-user "$me" --property=Linger --value 2>/dev/null || echo unknown)"
    - name: Format
      run: cargo fmt --all --check
    - name: "Platform isolation \u2014 dependency graph"
      run: ./scripts/platform-isolation.sh deps x86_64-unknown-linux-gnu
    - name: "Platform isolation \u2014 linkage"
      run: |
        set -euo pipefail
        cargo build --locked -p swamp
        ./scripts/platform-isolation.sh linkage target/debug/swamp
    - name: Clippy
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
    - name: Source audit
      run: cargo run --locked -p swamp-source-audit
    - name: Build tests
      run: cargo test --workspace --locked --no-run
    - name: Traversal, accounting and volume identity
      run: |
        set -euo pipefail
        cargo test --locked -p swamp-core --test traversal_accounting_and_volume_identity -- --nocapture
        cargo test --locked -p swamp-core --test walk_library_comparison -- --nocapture
        cargo test --locked -p swamp-core --test walk_library_comparison -- --ignored --nocapture
    - name: Test (native Linux)
      run: cargo test --workspace --locked --no-fail-fast
    - name: Repo gate (scripts/check.sh)
      env:
        SWAMP_CHECK_SKIP: fmt clippy audits tests
      run: ./scripts/check.sh
    env:
      GH_BUILDER_ID: 2ee3d075093275c6064c1c27cc625f9b4ce4e29c50795e4dd445ab72e8027f94
      SCCACHE_S3_KEY_PREFIX: builders/open-horizon-labs/swamp/2ee3d075093275c6064c1c27cc625f9b4ce4e29c50795e4dd445ab72e8027f94/
      RUSTC_WRAPPER: ${{ vars.LOCAL_LINUX_CI_ENABLED == 'true' && github.repository == 'open-horizon-labs/swamp' && (github.event_name
        != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'sccache' || '' }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ !(vars.LOCAL_LINUX_CI_ENABLED == 'true' && github.repository == 'open-horizon-labs/swamp' && (github.event_name
        != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && 'ghcr.io/open-horizon-labs/swamp@sha256:c63025de4b0d4a84336fa59a1df33119497755a9b1d7e04b1d910ee3e2b004d7'
        || '' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

  linux-x86_64-package:
    name: Linux x86_64 release archive, smoke and validation (Ubuntu 24.04)
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci'
    runs-on: ${{ vars.LOCAL_LINUX_CI_ENABLED == 'true' && github.repository == 'open-horizon-labs/swamp' && (github.event_name
      != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","builder:3555d11a4f2605e479b2"]')
      || 'ubuntu-24.04' }}
    steps:
    - name: Activate shared builder
      shell: bash
      run: |
        echo 'CARGO_HOME=/opt/gh-builder/cargo' >> "$GITHUB_ENV"
        echo 'RUSTUP_HOME=/opt/gh-builder/rustup' >> "$GITHUB_ENV"
        cat /opt/gh-builder/path >> "$GITHUB_PATH"
        cat /opt/gh-builder/env >> "$GITHUB_ENV"
        export CARGO_HOME=/opt/gh-builder/cargo RUSTUP_HOME=/opt/gh-builder/rustup
        export PATH=/opt/gh-builder/cargo/bin:$PATH
        export RUSTUP_TOOLCHAIN=stable
        rustup update stable --no-self-update
        rustup component add rustfmt clippy --toolchain stable
        rustup target add x86_64-unknown-linux-gnu --toolchain stable
        echo 'RUSTUP_TOOLCHAIN=stable' >> "$GITHUB_ENV"
        compiler=$(rustc -vV | sed -n 's/^commit-hash: //p')
        export SCCACHE_S3_KEY_PREFIX="${SCCACHE_S3_KEY_PREFIX}${compiler}/"
        echo "SCCACHE_S3_KEY_PREFIX=$SCCACHE_S3_KEY_PREFIX" >> "$GITHUB_ENV"
        if [ "${RUSTC_WRAPPER:-}" = sccache ]; then
          # The base runner starts its daemon before Actions provides job env.
          # Restart before compiling so the daemon adopts this consumer's namespace.
          sccache --stop-server >/dev/null 2>&1 || true
          sccache --start-server
          sccache --show-stats
        fi
    - uses: actions/checkout@v5
    - name: Cargo cache
      if: vars.LOCAL_LINUX_CI_ENABLED != 'true'
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ci-linux-x86_64-release
    - name: Build (release, generic x86-64)
      run: cargo build --release --locked --target x86_64-unknown-linux-gnu -p swamp
    - name: Package
      run: |
        set -euo pipefail
        v="$(./scripts/release-version.sh | cut -d= -f2)"
        ./scripts/package-release.sh x86_64-unknown-linux-gnu "$v" target/x86_64-unknown-linux-gnu/release/swamp dist
    - name: Smoke, linkage and minimum glibc (extracted archive)
      run: |
        set -euo pipefail
        v="$(./scripts/release-version.sh | cut -d= -f2)"
        ./scripts/release-smoke.sh "dist/swamp-${v}-x86_64-unknown-linux-gnu.tar.gz" "$v" dist/report
        ./scripts/platform-isolation.sh linkage target/x86_64-unknown-linux-gnu/release/swamp
    - name: Linux validation (#89)
      run: |
        set -euo pipefail
        v="$(./scripts/release-version.sh | cut -d= -f2)"
        ./scripts/linux-validation.sh "dist/swamp-${v}-x86_64-unknown-linux-gnu.tar.gz" "$v" dist/report
    - name: Upload archive and reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: swamp-x86_64-unknown-linux-gnu-ci
        path: |
          dist/*.tar.gz
          dist/*.sha256
          dist/report/*
    env:
      GH_BUILDER_ID: 2ee3d075093275c6064c1c27cc625f9b4ce4e29c50795e4dd445ab72e8027f94
      SCCACHE_S3_KEY_PREFIX: builders/open-horizon-labs/swamp/2ee3d075093275c6064c1c27cc625f9b4ce4e29c50795e4dd445ab72e8027f94/
      RUSTC_WRAPPER: ${{ vars.LOCAL_LINUX_CI_ENABLED == 'true' && github.repository == 'open-horizon-labs/swamp' && (github.event_name
        != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'sccache' || '' }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ !(vars.LOCAL_LINUX_CI_ENABLED == 'true' && github.repository == 'open-horizon-labs/swamp' && (github.event_name
        != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && 'ghcr.io/open-horizon-labs/swamp@sha256:c63025de4b0d4a84336fa59a1df33119497755a9b1d7e04b1d910ee3e2b004d7'
        || '' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

  linux-newer-smoke:
    name: Linux x86_64 archive on the newest hosted Ubuntu (test-only)
    needs: linux-x86_64-package
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Which Ubuntu this is
        run: |
          set -euo pipefail
          . /etc/os-release && echo "$PRETTY_NAME"
          ldd --version | head -1

      - uses: actions/download-artifact@v4
        with:
          name: swamp-x86_64-unknown-linux-gnu-ci
          path: dist

      - name: Smoke and validation of the 24.04-built archive here
        run: |
          set -euo pipefail
          v="$(./scripts/release-version.sh | cut -d= -f2)"
          ./scripts/release-smoke.sh "dist/swamp-${v}-x86_64-unknown-linux-gnu.tar.gz" "$v" newer
          ./scripts/linux-validation.sh "dist/swamp-${v}-x86_64-unknown-linux-gnu.tar.gz" "$v" newer

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swamp-linux-newer-validation
          path: newer/*

  macos-arm64:
    name: macOS arm64
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci'
    runs-on: ${{ vars.LOCAL_MACOS_CI_ENABLED == 'true' && fromJSON('["self-hosted","macOS","ARM64","macos-arm64"]') || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy

      # The fleet runner keeps target/ and ~/.cargo on its own disk, so
      # routing either through GitHub's cache backend there is waste (see
      # release.yml). Cache only on the ephemeral hosted fallback.
      - name: Cargo cache
        if: vars.LOCAL_MACOS_CI_ENABLED != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-macos-arm64

      - name: Environment
        run: |
          set -euo pipefail
          uname -a
          sw_vers
          rustc -vV

      - name: Format
        run: cargo fmt --all --check

      # Ordered cheapest-and-most-specific first. The workspace suite
      # takes minutes and one failing test hides every later step, so the
      # platform-isolation evidence this workflow exists for runs before
      # it rather than behind it.
      - name: Platform isolation — dependency graph
        run: ./scripts/platform-isolation.sh deps aarch64-apple-darwin

      - name: Platform isolation — linkage
        run: |
          set -euo pipefail
          cargo build --locked -p swamp
          ./scripts/platform-isolation.sh linkage target/debug/swamp

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Source audit
        run: cargo run --locked -p swamp-source-audit

      - name: Build tests
        run: cargo test --workspace --locked --no-run

      # #80, as its own step rather than buried in the suite: allocated
      # bytes, hardlink dedup, sparse files, symlink loops and volume
      # identity, checked against the filesystem and against `du` on the
      # filesystem this runner actually mounts -- APFS.
      # The benchmark prints; it gates nothing, because wall time on a
      # shared runner is not a merge criterion. Its numbers are what
      # docs/platform.md quotes.
      - name: Traversal, accounting and volume identity
        run: |
          set -euo pipefail
          cargo test --locked -p swamp-core --test traversal_accounting_and_volume_identity -- --nocapture
          cargo test --locked -p swamp-core --test walk_library_comparison -- --nocapture
          cargo test --locked -p swamp-core --test walk_library_comparison -- --ignored --nocapture

      # `--no-fail-fast`: bringing a second platform up, the useful
      # signal is every test that fails, not the first binary that does.
      - name: Test (native macOS)
        run: cargo test --workspace --locked --no-fail-fast

      # fmt, clippy, the source audit and the workspace tests already ran
      # above as their own steps (same commands, same tree), so the gate
      # runs only what is left: release-graph, named targets and greps.
      - name: Repo gate (scripts/check.sh)
        env:
          SWAMP_CHECK_SKIP: fmt clippy audits tests
        run: ./scripts/check.sh

  builder-package-access:
    name: Prepared builder package access
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/open-horizon-labs/swamp@sha256:c63025de4b0d4a84336fa59a1df33119497755a9b1d7e04b1d910ee3e2b004d7
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Verify baked stable tools
      shell: bash
      run: 'export CARGO_HOME=/opt/gh-builder/cargo RUSTUP_HOME=/opt/gh-builder/rustup
        RUSTUP_TOOLCHAIN=stable

        export PATH=/opt/gh-builder/cargo/bin:$PATH

        rustc --version

        cargo clippy --version

        cargo fmt --version

        rustup target list --installed

        '
