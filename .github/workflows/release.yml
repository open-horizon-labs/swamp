name: Release

# Tag pushes are the single release trigger (`git tag vX.Y.Z && git push --tags`,
# or `gh release create`, which pushes the tag). Two build jobs, one per
# supported target, each producing its own archives and checksums; an
# archive-only job on a newer Ubuntu; two full-tier jobs (the same
# `scripts/check-full.sh` `check-full.yml` runs for a PR labelled
# `full-check`, one per OS); and one publishing job that runs only after
# every one of those succeeds, so a release is never published half-built,
# with one target's assets overwriting another's (#88), or with the full
# tier (compile-fail cases, mutation sweep, cost test) not yet checked on
# this exact tagged commit.
#
#   macos-arm64              aarch64-apple-darwin, release binary, package, smoke
#   linux-x86_64             x86_64-unknown-linux-gnu on Ubuntu 24.04 (the baseline),
#                            generic x86-64 CPU, package, smoke, linkage + glibc
#   linux-x86_64-newer       archive-only: the 24.04-built archive smoke-tested on the
#                            newest hosted Ubuntu; no second build or workspace suite
#   linux-x86_64-check-full,
#   macos-arm64-check-full   scripts/check-full.sh, one per OS -- independent of the
#                            build jobs (their own toolchain/cache), required by
#                            `release` alongside them
#   release                  needs all five; publishes every archive + checksum
#
# Each archive holds the CLI/TUI binary, README.md and the agent skill
# (skills/swamp/). There is no separate MCP server binary (removed #104):
# the CLI's --json output plus the packaged skill is the agent interface,
# and no MCP artifact is built for either target.
#
# macOS runner: the org's local Apple-silicon builder when
# LOCAL_MACOS_CI_ENABLED is set, otherwise GitHub's hosted macOS runner.
# The fleet runner is a persistent VM whose target/ and ~/.cargo survive
# between jobs on its own disk, so neither is routed through GitHub's
# cache there. Caches are keyed per target and profile, never shared.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Never target-cpu=native: a release binary must run on any machine of
  # its target, not only on the runner that built it (docs/platform.md).
  RUSTFLAGS: ""

jobs:
  macos-arm64:
    name: macOS arm64
    runs-on: ${{ vars.LOCAL_MACOS_CI_ENABLED == 'true' && fromJSON('["self-hosted","macOS","ARM64","macos-arm64"]') || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cargo cache
        if: vars.LOCAL_MACOS_CI_ENABLED != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos-arm64

      - name: Version
        id: v
        run: ./scripts/release-version.sh >> "$GITHUB_OUTPUT"

      # swamp-core's `testing` feature is test-fixture API. Only
      # `[dev-dependencies]` enable it, and resolver 2 never unifies those
      # into this build; refuse a graph that says otherwise before
      # building what ships (the full-check test job has it on by design).
      - name: Release graph has no test-fixture API
        run: |
          set -euo pipefail
          if cargo tree -p swamp -e normal,build,features --prefix none --locked --target aarch64-apple-darwin |
            grep -q 'swamp-core feature "testing"'; then
            echo 'the swamp binary would enable swamp-core/testing' >&2
            exit 1
          fi

      - name: Build (release, aarch64-apple-darwin)
        env:
          SCCACHE_GHA_ENABLED: "${{ vars.LOCAL_MACOS_CI_ENABLED != 'true' }}"
          RUSTC_WRAPPER: sccache
        run: cargo build --release --locked --target aarch64-apple-darwin -p swamp

      - name: Package
        run: ./scripts/package-release.sh aarch64-apple-darwin "${{ steps.v.outputs.version }}" target/aarch64-apple-darwin/release/swamp dist

      - name: Smoke (the extracted archive, not target/)
        run: |
          set -euo pipefail
          ./scripts/release-smoke.sh "dist/swamp-${{ steps.v.outputs.version }}-aarch64-apple-darwin.tar.gz" "${{ steps.v.outputs.version }}" dist/smoke
          ./scripts/release-smoke.sh dist/swamp-aarch64-apple-darwin.tar.gz "${{ steps.v.outputs.version }}"
          otool -L target/aarch64-apple-darwin/release/swamp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: swamp-aarch64-apple-darwin
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/smoke/*

  linux-x86_64:
    name: Linux x86_64 (Ubuntu 24.04)
    # The selected validation baseline. The binary built here links the
    # glibc of this image; the smoke step records the newest glibc symbol
    # version it requires, which is the documented minimum.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux-x86_64

      - name: Version
        id: v
        run: ./scripts/release-version.sh >> "$GITHUB_OUTPUT"

      # swamp-core's `testing` feature is test-fixture API. Only
      # `[dev-dependencies]` enable it, and resolver 2 never unifies those
      # into this build; refuse a graph that says otherwise before
      # building what ships (the full-check test job has it on by design).
      - name: Release graph has no test-fixture API
        run: |
          set -euo pipefail
          if cargo tree -p swamp -e normal,build,features --prefix none --locked --target x86_64-unknown-linux-gnu |
            grep -q 'swamp-core feature "testing"'; then
            echo 'the swamp binary would enable swamp-core/testing' >&2
            exit 1
          fi

      - name: Build (release, x86_64-unknown-linux-gnu, generic x86-64)
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu -p swamp

      - name: Package
        run: ./scripts/package-release.sh x86_64-unknown-linux-gnu "${{ steps.v.outputs.version }}" target/x86_64-unknown-linux-gnu/release/swamp dist

      - name: Smoke, linkage and minimum glibc (the extracted archive)
        run: |
          set -euo pipefail
          ./scripts/release-smoke.sh "dist/swamp-${{ steps.v.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz" "${{ steps.v.outputs.version }}" dist/smoke
          ./scripts/release-smoke.sh dist/swamp-x86_64-unknown-linux-gnu.tar.gz "${{ steps.v.outputs.version }}"
          ./scripts/platform-isolation.sh linkage target/x86_64-unknown-linux-gnu/release/swamp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: swamp-x86_64-unknown-linux-gnu
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/smoke/*

  linux-x86_64-newer:
    name: Linux x86_64 (newest hosted Ubuntu, archive-only)
    needs: linux-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Which Ubuntu this is
        run: |
          set -euo pipefail
          . /etc/os-release && echo "$PRETTY_NAME"
          ldd --version | head -1

      - uses: actions/download-artifact@v4
        with:
          name: swamp-x86_64-unknown-linux-gnu
          path: dist

      # The archive built on the 24.04 baseline must run unchanged on a
      # newer release: that is the forward-compatibility claim the docs
      # make, and the only one.
      - name: Smoke the 24.04-built archive here
        run: |
          set -euo pipefail
          v="$(./scripts/release-version.sh | cut -d= -f2)"
          ./scripts/release-smoke.sh "dist/swamp-${v}-x86_64-unknown-linux-gnu.tar.gz" "$v" dist/smoke-newer

      - name: Upload smoke report
        uses: actions/upload-artifact@v4
        with:
          name: swamp-linux-newer-smoke
          path: dist/smoke-newer/*

  linux-x86_64-check-full:
    name: Linux x86_64 (check-full)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Test fixtures make git commits; never let them reach a signing
      # agent on the runner.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: commit.gpgsign
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: check-full-linux-x86_64

      - name: scripts/check-full.sh
        run: scripts/check-full.sh

  macos-arm64-check-full:
    name: macOS arm64 (check-full)
    runs-on: ${{ vars.LOCAL_MACOS_CI_ENABLED == 'true' && fromJSON('["self-hosted","macOS","ARM64","macos-arm64"]') || 'macos-latest' }}
    timeout-minutes: 90
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: commit.gpgsign
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy

      - name: Cargo cache
        if: vars.LOCAL_MACOS_CI_ENABLED != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: check-full-macos-arm64

      - name: scripts/check-full.sh
        run: scripts/check-full.sh

  release:
    name: Publish
    needs:
      [
        macos-arm64,
        linux-x86_64,
        linux-x86_64-newer,
        linux-x86_64-check-full,
        macos-arm64-check-full,
      ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          find artifacts -name '*.sha256' -exec cp {} dist/ \;
          (cd dist && ls -l && for f in *.sha256; do sha256sum -c "$f"; done)
          # One archive name per target and version: two targets can
          # never write the same asset.
          test "$(ls dist/*.tar.gz | wc -l)" -eq 4

      # Release notes are written by a human in CHANGELOG.md under
      # `## vX.Y.Z`; the release fails if the tag has no entry.
      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          v="${GITHUB_REF#refs/tags/}"
          awk -v tag="$v" '
            $0 ~ "^## " tag "([[:space:]]|$)" { on=1; next }
            /^## / && on { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section '## $v' — write the release notes before tagging." >&2
            exit 1
          fi
          {
            echo
            echo "### Install (macOS, Apple silicon)"
            echo '```bash'
            echo 'brew install open-horizon-labs/tap/swamp'
            echo 'swamp --version'
            echo '```'
            echo 'Update with `brew upgrade swamp`.'
            echo
            echo "### Install (Linux x86_64, glibc; built and tested on Ubuntu 24.04)"
            echo '```bash'
            echo 'curl -fLO https://github.com/open-horizon-labs/swamp/releases/latest/download/swamp-x86_64-unknown-linux-gnu.tar.gz'
            echo 'curl -fLO https://github.com/open-horizon-labs/swamp/releases/latest/download/swamp-x86_64-unknown-linux-gnu.tar.gz.sha256'
            echo 'sha256sum -c swamp-x86_64-unknown-linux-gnu.tar.gz.sha256'
            echo 'tar -xzf swamp-x86_64-unknown-linux-gnu.tar.gz'
            echo 'mkdir -p ~/.local/bin'
            echo 'install -m 755 swamp-x86_64-unknown-linux-gnu/swamp ~/.local/bin/'
            echo '```'
            echo 'Versioned archives for both targets are also attached below.'
          } >> release-notes.md

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          body_path: release-notes.md
