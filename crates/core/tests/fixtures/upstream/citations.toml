# Vendored upstream citations for `crates/core/src/agents/matrix.rs`.
#
# Every `Supported` row in the matrix has to be backed by a source that
# *establishes* its claim, not merely by a string longer than thirty
# characters. The 2026-09-22 independent re-review fetched all fourteen
# rows' citations and found six that did not -- four of them
# consequential in the adapter. This file is what replaced the length
# check.
#
# One `[[citation]]` block per upstream file:
#
#   tool     the matrix row it backs (`AgentToolId::slug`)
#   repo     the upstream repository, or the docs host for a doc page
#   commit   a 40-hex commit SHA, or `retrieved <date>` for a doc page
#            that has no commit (a docs site is not a git tree)
#   path     the upstream path, exactly as `MatrixEntry::verification`'s
#            `source` names it -- the two are matched by string
#   symbols  strings the row's claim depends on, checked verbatim
#            against the excerpt by
#            `crates/core/tests/upstream_citations_are_checked.rs`
#   excerpt  the vendored minimal excerpt, relative to this directory
#   blake3   its digest, so an excerpt edited to make a claim fit stops
#            matching
#   upstream_blake3
#            the digest of the whole upstream file at `commit`, recorded
#            when the excerpt was vendored (2026-09-22, by
#            `SWAMP_RECORD_UPSTREAM=1 cargo test --test
#            upstream_citations_are_checked`), so a re-fetch
#            (`SWAMP_FETCH_UPSTREAM=1`) proves the excerpt's lines are the
#            file's; `doc-page` for a docs page, which has no commit and
#            whose excerpt is author-supplied
#
# Excerpts are a few lines each, carry a provenance header naming the
# repository, commit and path, and are kept only for verification.
# Licences: Apache-2.0 (codex, gemini-cli, cline, roo-code, continue,
# aider), MIT (opencode, pi, oh-my-pi), CC-BY-4.0 (github/docs); doc
# pages are quoted at the few lines the claim rests on.
#
# NOT vendored, deliberately: `github/copilot-cli`'s changelog is under a
# proprietary licence that permits unmodified redistribution only, so it
# is recorded as line numbers plus exact symbol strings at
# `copilot-cli/c13b3dcae4/NO-VENDOR-changelog.md` and is *not* listed
# here -- a note of what was read, which is weaker than a citation and
# is not used to back a claim.

