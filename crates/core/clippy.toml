# The capability gate, type-resolved (`crates/core/src/fs_gate/mod.rs`).
#
# Every method and type below is the standard library's way to touch the
# filesystem or start a process. Each crate root denies these lints for
# non-test builds (`#![cfg_attr(not(test), deny(...))]`); `fs_gate` (and
# the FSEvents FFI child of `fs_events`) allow them. Integration tests
# and `#[cfg(test)]` modules build fixtures with them freely: the
# workspace `[lints]` table allows them, and the crate-root `deny` only
# applies to the library itself.
#
# The `gate_paths_only_inside_gates` source audit is the other half: it
# rejects the same paths by name, including in code clippy never
# compiles (`cfg`'d-out blocks, uninvoked `macro_rules!`, orphan files)
# and whole crates (`libc`, `tempfile`, `parquet`).
disallowed-methods = [
  { path = "std::fs::canonicalize", reason = "use crate::fs_gate" },
  { path = "std::fs::copy", reason = "use crate::fs_gate::destroy" },
  { path = "std::fs::create_dir", reason = "use crate::fs_gate::store" },
  { path = "std::fs::create_dir_all", reason = "use crate::fs_gate::store" },
  { path = "std::fs::exists", reason = "use crate::fs_gate" },
  { path = "std::fs::hard_link", reason = "use crate::fs_gate::destroy" },
  { path = "std::fs::metadata", reason = "use crate::fs_gate" },
  { path = "std::fs::read", reason = "use crate::fs_gate::read" },
  { path = "std::fs::read_dir", reason = "use crate::fs_gate (walker modules only)" },
  { path = "std::fs::read_link", reason = "use crate::fs_gate" },
  { path = "std::fs::read_to_string", reason = "use crate::fs_gate::read" },
  { path = "std::fs::remove_dir", reason = "use crate::fs_gate::destroy" },
  { path = "std::fs::remove_dir_all", reason = "use crate::fs_gate::destroy" },
  { path = "std::fs::remove_file", reason = "use crate::fs_gate" },
  { path = "std::fs::rename", reason = "use crate::fs_gate::destroy" },
  { path = "std::fs::set_permissions", reason = "use crate::fs_gate" },
  { path = "std::fs::soft_link", reason = "use crate::fs_gate" },
  { path = "std::fs::symlink_metadata", reason = "use crate::fs_gate" },
  { path = "std::fs::write", reason = "use crate::fs_gate::store" },
  { path = "std::fs::File::open", reason = "use crate::fs_gate::read" },
  { path = "std::fs::File::create", reason = "use crate::fs_gate::store" },
  { path = "std::fs::File::create_new", reason = "use crate::fs_gate::store" },
  { path = "std::fs::File::options", reason = "use crate::fs_gate" },
  { path = "std::fs::OpenOptions::new", reason = "use crate::fs_gate" },
  { path = "std::fs::OpenOptions::open", reason = "use crate::fs_gate" },
  { path = "std::os::unix::fs::symlink", reason = "use crate::fs_gate" },
  { path = "std::path::Path::canonicalize", reason = "use crate::fs_gate::canonicalize" },
  { path = "std::path::Path::exists", reason = "use crate::fs_gate::exists" },
  { path = "std::path::Path::is_dir", reason = "use crate::fs_gate::is_dir" },
  { path = "std::path::Path::is_file", reason = "use crate::fs_gate::is_file" },
  { path = "std::path::Path::is_symlink", reason = "use crate::fs_gate::symlink_metadata" },
  { path = "std::path::Path::metadata", reason = "use crate::fs_gate::symlink_metadata" },
  { path = "std::path::Path::read_dir", reason = "use crate::fs_gate (walker modules only)" },
  { path = "std::path::Path::read_link", reason = "use crate::fs_gate::read_link" },
  { path = "std::path::Path::symlink_metadata", reason = "use crate::fs_gate::symlink_metadata" },
  { path = "std::path::Path::try_exists", reason = "use crate::fs_gate::exists" },
  { path = "std::io::copy", reason = "use crate::fs_gate::read::bounded_read" },
  { path = "std::io::read_to_string", reason = "use crate::fs_gate::read::bounded_read" },
  { path = "std::io::Read::read_to_end", reason = "use crate::fs_gate::read::bounded_read" },
  { path = "std::io::Read::read_to_string", reason = "use crate::fs_gate::read::bounded_read" },
  { path = "std::io::Read::bytes", reason = "use crate::fs_gate::read::bounded_read" },
  { path = "std::process::Command::new", reason = "use crate::fs_gate::spawn::run" },
  # gitoxide re-exports file removal, subprocesses, temp and lock files
  # (`gix_fs`, `gix_command`, `gix_tempfile`, `gix_lock`): its entry
  # points live in `fs_gate::git`, read-only.
  { path = "gix::open", reason = "use crate::fs_gate::git" },
  { path = "gix::open_opts", reason = "use crate::fs_gate::git" },
  { path = "gix::discover", reason = "use crate::fs_gate::git" },
  { path = "gix::init", reason = "use crate::fs_gate::git" },
  { path = "gix::init_bare", reason = "use crate::fs_gate::git" },
]
disallowed-types = [
  { path = "std::fs::File", reason = "no file handles outside crate::fs_gate" },
  { path = "std::fs::OpenOptions", reason = "no file handles outside crate::fs_gate" },
  { path = "std::process::Command", reason = "use crate::fs_gate::spawn::run" },
  { path = "std::process::Child", reason = "use crate::fs_gate::spawn::run" },
  { path = "std::io::BufReader", reason = "use crate::fs_gate::read" },
  { path = "tempfile::NamedTempFile", reason = "use crate::fs_gate::store" },
  { path = "gix::Repository", reason = "use crate::fs_gate::git" },
  { path = "gix::ThreadSafeRepository", reason = "use crate::fs_gate::git" },
]
