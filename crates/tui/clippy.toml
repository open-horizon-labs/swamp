# The capability gate, type-resolved (`crates/core/src/fs_gate/mod.rs`).
#
# Every method and type below is the standard library's way to touch the
# filesystem or start a process. Each crate root denies these lints for
# non-test builds (`#![cfg_attr(not(test), deny(...))]`); `fs_gate` (and
# the FSEvents FFI child of `fs_events`) allow them. Integration tests
# and `#[cfg(test)]` modules build fixtures with them freely: the
# workspace `[lints]` table allows them, and the crate-root `deny` only
# applies to the library itself.
#
# The `gate_paths_only_inside_gates` source audit is the other half: it
# rejects the same paths by name, including in code clippy never
# compiles (`cfg`'d-out blocks, uninvoked `macro_rules!`, orphan files)
# and whole crates (`libc`, `tempfile`, `parquet`).
disallowed-methods = [
  { path = "std::fs::canonicalize", reason = "use swamp_core::fs_gate" },
  { path = "std::fs::copy", reason = "use swamp_core::fs_gate::destroy" },
  { path = "std::fs::create_dir", reason = "use swamp_core::fs_gate::store" },
  { path = "std::fs::create_dir_all", reason = "use swamp_core::fs_gate::store" },
  { path = "std::fs::exists", reason = "use swamp_core::fs_gate" },
  { path = "std::fs::hard_link", reason = "use swamp_core::fs_gate::destroy" },
  { path = "std::fs::metadata", reason = "use swamp_core::fs_gate" },
  { path = "std::fs::read", reason = "use swamp_core::fs_gate::read" },
  { path = "std::fs::read_dir", reason = "use swamp_core::fs_gate (walker modules only)" },
  { path = "std::fs::read_link", reason = "use swamp_core::fs_gate" },
  { path = "std::fs::read_to_string", reason = "use swamp_core::fs_gate::read" },
  { path = "std::fs::remove_dir", reason = "use swamp_core::fs_gate::destroy" },
  { path = "std::fs::remove_dir_all", reason = "use swamp_core::fs_gate::destroy" },
  { path = "std::fs::remove_file", reason = "use swamp_core::fs_gate" },
  { path = "std::fs::rename", reason = "use swamp_core::fs_gate::destroy" },
  { path = "std::fs::set_permissions", reason = "use swamp_core::fs_gate" },
  { path = "std::fs::soft_link", reason = "use swamp_core::fs_gate" },
  { path = "std::fs::symlink_metadata", reason = "use swamp_core::fs_gate" },
  { path = "std::fs::write", reason = "use swamp_core::fs_gate::store" },
  { path = "std::fs::File::open", reason = "use swamp_core::fs_gate::read" },
  { path = "std::fs::File::create", reason = "use swamp_core::fs_gate::store" },
  { path = "std::fs::File::create_new", reason = "use swamp_core::fs_gate::store" },
  { path = "std::fs::File::options", reason = "use swamp_core::fs_gate" },
  { path = "std::fs::OpenOptions::new", reason = "use swamp_core::fs_gate" },
  { path = "std::fs::OpenOptions::open", reason = "use swamp_core::fs_gate" },
  { path = "std::os::unix::fs::symlink", reason = "use swamp_core::fs_gate" },
  { path = "std::path::Path::canonicalize", reason = "use swamp_core::fs_gate::canonicalize" },
  { path = "std::path::Path::exists", reason = "use swamp_core::fs_gate::exists" },
  { path = "std::path::Path::is_dir", reason = "use swamp_core::fs_gate::is_dir" },
  { path = "std::path::Path::is_file", reason = "use swamp_core::fs_gate::is_file" },
  { path = "std::path::Path::is_symlink", reason = "use swamp_core::fs_gate::symlink_metadata" },
  { path = "std::path::Path::metadata", reason = "use swamp_core::fs_gate::symlink_metadata" },
  { path = "std::path::Path::read_dir", reason = "use swamp_core::fs_gate (walker modules only)" },
  { path = "std::path::Path::read_link", reason = "use swamp_core::fs_gate::read_link" },
  { path = "std::path::Path::symlink_metadata", reason = "use swamp_core::fs_gate::symlink_metadata" },
  { path = "std::path::Path::try_exists", reason = "use swamp_core::fs_gate::exists" },
  { path = "std::io::copy", reason = "use swamp_core::fs_gate::read::bounded_read" },
  { path = "std::io::read_to_string", reason = "use swamp_core::fs_gate::read::bounded_read" },
  { path = "std::io::Read::read_to_end", reason = "use swamp_core::fs_gate::read::bounded_read" },
  { path = "std::io::Read::read_to_string", reason = "use swamp_core::fs_gate::read::bounded_read" },
  { path = "std::io::Read::bytes", reason = "use swamp_core::fs_gate::read::bounded_read" },
  { path = "std::process::Command::new", reason = "use swamp_core::fs_gate::spawn::run" },
  # The TUI's event loop never blocks: work runs on `worker::spawn`,
  # which has no join. `worker.rs` allows these; nothing else in the
  # crate may name them (`tui_event_thread_has_no_gate_calls`).
  { path = "std::thread::spawn", reason = "use crate::worker::spawn" },
  { path = "std::thread::Builder::spawn", reason = "use crate::worker::spawn" },
  { path = "std::thread::JoinHandle::join", reason = "the event loop never waits on a worker" },
]
disallowed-types = [
  { path = "std::fs::File", reason = "no file handles outside swamp_core::fs_gate" },
  { path = "std::fs::OpenOptions", reason = "no file handles outside swamp_core::fs_gate" },
  { path = "std::process::Command", reason = "use swamp_core::fs_gate::spawn::run" },
  { path = "std::process::Child", reason = "use swamp_core::fs_gate::spawn::run" },
  { path = "std::io::BufReader", reason = "use swamp_core::fs_gate::read" },
  { path = "tempfile::NamedTempFile", reason = "use swamp_core::fs_gate::store" },
]
